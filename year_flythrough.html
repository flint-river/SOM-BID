<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Flythrough</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* Stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header .line-info {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
        }

        /* Stats panel */
        .stats-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 1.1rem;
        }

        .stat-label {
            color: #888;
            margin-right: 30px;
        }

        .stat-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-value.work { color: #ff6b6b; }
        .stat-value.off { color: #51cf66; }
        .stat-value.weekend { color: #ffd43b; }

        /* Current date display */
        .current-date {
            position: fixed;
            top: 50%;
            right: 50px;
            transform: translateY(-50%);
            text-align: right;
            z-index: 100;
        }

        .current-date .month {
            font-size: 4rem;
            font-weight: 100;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .current-date .day {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .current-date .year {
            font-size: 2rem;
            font-weight: 300;
            color: #666;
        }

        .current-date .shift {
            font-size: 2.5rem;
            font-weight: 600;
            margin-top: 20px;
            padding: 10px 25px;
            border-radius: 10px;
            display: inline-block;
        }

        /* The flythrough container */
        .flythrough-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1500px;
            perspective-origin: center center;
        }

        .ribbon-track {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        .day-segment {
            position: absolute;
            width: 80px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, opacity 0.3s ease;
            backface-visibility: hidden;
        }

        .day-segment.current {
            transform: scale(1.5);
            box-shadow: 0 0 60px currentColor;
            z-index: 10;
        }

        .day-segment.passed {
            opacity: 0.3;
        }

        /* Month markers */
        .month-marker {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
            transform-style: preserve-3d;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #00d4ff;
            transform: scale(1.1);
        }

        .control-btn.active {
            background: #00d4ff;
            border-color: #00d4ff;
        }

        /* Speed indicator */
        .speed-indicator {
            position: fixed;
            bottom: 100px;
            right: 45px;
            font-size: 0.9rem;
            color: #888;
            z-index: 100;
        }

        /* Progress bar */
        .progress-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #888;
        }

        /* Line selector */
        .line-selector {
            position: fixed;
            top: 80px;
            left: 30px;
            z-index: 100;
        }

        .line-selector select {
            padding: 12px 20px;
            font-size: 1rem;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            min-width: 200px;
        }

        .line-selector select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        /* Spiral view (alternative) */
        .spiral-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Preparing your journey through the year...</div>
    </div>

    <!-- Stars background -->
    <div class="stars" id="stars"></div>

    <!-- Back button -->
    <a href="index.html" class="back-btn">← Back to Bid</a>

    <!-- Header -->
    <div class="header">
        <h1>Year Flythrough</h1>
        <div class="line-info" id="lineInfo">Line --</div>
    </div>

    <!-- Line selector -->
    <div class="line-selector">
        <select id="lineSelect" onchange="loadLine(this.value)">
            <option value="">Select a line...</option>
        </select>
    </div>

    <!-- Current date display -->
    <div class="current-date">
        <div class="month" id="currentMonth">APRIL</div>
        <div class="day" id="currentDay">01</div>
        <div class="year" id="currentYear">2027</div>
        <div class="shift" id="currentShift">--</div>
    </div>

    <!-- Stats panel -->
    <div class="stats-panel">
        <div class="stat-row">
            <span class="stat-label">Days Flown</span>
            <span class="stat-value" id="dayCount">0 / 365</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Work Days</span>
            <span class="stat-value work" id="workDays">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Days Off</span>
            <span class="stat-value off" id="daysOff">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Weekends Off</span>
            <span class="stat-value weekend" id="weekendsOff">0 / 0</span>
        </div>
    </div>

    <!-- Flythrough container -->
    <div class="flythrough-container" id="flythroughContainer">
        <div class="ribbon-track" id="ribbonTrack"></div>
    </div>

    <!-- Controls -->
    <div class="speed-indicator">Speed: <span id="speedDisplay">1x</span></div>
    <div class="controls">
        <button class="control-btn" id="rewindBtn" onclick="rewind()" title="Restart">⟲</button>
        <button class="control-btn active" id="playPauseBtn" onclick="togglePlay()" title="Play/Pause">❚❚</button>
        <button class="control-btn" id="speedBtn" onclick="cycleSpeed()" title="Speed">▶▶</button>
    </div>

    <!-- Progress bar -->
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Scripts -->
    <script src="BID_CONFIG.js"></script>
    <script src="bid_year_integration.js"></script>
    <script src="pattern_loader.js"></script>
    <script src="calendar_generator.js"></script>

    <script>
        // Color map matching the main app
        const COLOR_MAP = {
            1: '#FFC000',  // SSOM
            2: '#00FFFF',  // SOM Group 1
            3: '#00B0F0',  // SOM Group 2
            4: '#FF0000',  // SOM Group 3
            5: '#FFCCFF',  // SOM Group 4
            6: '#C0C0C0',  // M18
            7: '#FFFF00',  // Relief
            8: '#00FF00',  // Off
            9: '#FF66FF',  // A10O/P12ATL
            99: '#7030A0', // Mixed
        };

        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];

        let calendar = null;
        let currentLine = null;
        let lineData = null;
        let allDays = [];
        let currentDayIndex = 0;
        let isPlaying = true;
        let speed = 1;
        let animationFrame = null;
        let lastTimestamp = 0;
        let dayDuration = 150; // ms per day at 1x speed

        // Stats
        let workDays = 0;
        let daysOff = 0;
        let weekendDaysOff = 0;
        let totalWeekendDays = 0;

        // Generate stars
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Initialize
        async function init() {
            generateStars();

            // Get line from URL
            const params = new URLSearchParams(window.location.search);
            const lineParam = params.get('line');

            try {
                // Load patterns
                if (typeof PatternLoader !== 'undefined') {
                    await PatternLoader.load('patterns.json');
                }

                // Initialize calendar
                if (typeof initializeCalendar === 'function') {
                    calendar = initializeCalendar();
                } else if (typeof ALL_LINES_CALENDAR !== 'undefined') {
                    calendar = ALL_LINES_CALENDAR;
                }

                // Populate line selector
                populateLineSelector();

                if (lineParam && calendar[lineParam]) {
                    loadLine(lineParam);
                }

                document.getElementById('loadingScreen').classList.add('hidden');

            } catch (err) {
                console.error('Init error:', err);
                document.querySelector('.loading-text').textContent = 'Error loading data: ' + err.message;
            }
        }

        function populateLineSelector() {
            const select = document.getElementById('lineSelect');

            if (!window.ANNUAL_BID) return;

            // Sort: SSOM first, then SOM
            const sorted = [...window.ANNUAL_BID].sort((a, b) => {
                if (a.lineDesc === 'SSOM' && b.lineDesc !== 'SSOM') return -1;
                if (a.lineDesc !== 'SSOM' && b.lineDesc === 'SSOM') return 1;
                return parseInt(a.lineNumber || a.lineNbr) - parseInt(b.lineNumber || b.lineNbr);
            });

            sorted.forEach(line => {
                const opt = document.createElement('option');
                opt.value = line.lineNbr;
                const displayNum = line.lineNumber || line.lineNbr.split('-')[0];
                opt.textContent = `Line ${displayNum} (${line.lineDesc})`;
                select.appendChild(opt);
            });
        }

        function loadLine(lineNbr) {
            if (!lineNbr || !calendar || !calendar[lineNbr]) return;

            currentLine = lineNbr;
            lineData = window.ANNUAL_BID.find(l => l.lineNbr === lineNbr);

            document.getElementById('lineSelect').value = lineNbr;

            const displayNum = lineData.lineNumber || lineNbr.split('-')[0];
            document.getElementById('lineInfo').textContent = `Line ${displayNum} (${lineData.lineDesc})`;

            // Build days array
            buildDaysArray();

            // Reset and start
            rewind();
        }

        function buildDaysArray() {
            allDays = [];
            const calData = calendar[currentLine];
            if (!calData || !calData.days) return;

            // Get all dates and sort them
            const dates = Object.keys(calData.days).sort((a, b) => {
                const [y1, m1, d1] = a.split('-').map(Number);
                const [y2, m2, d2] = b.split('-').map(Number);
                return new Date(y1, m1 - 1, d1) - new Date(y2, m2 - 1, d2);
            });

            dates.forEach((dateStr, index) => {
                const [year, month, day] = dateStr.split('-').map(Number);
                const date = new Date(year, month - 1, day);
                const dayOfWeek = date.getDay();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                const shift = calData.days[dateStr].s;
                const isOff = shift === '--' || shift === '-' || !shift;

                // Get color from pattern
                const patternIndex = index % 12;
                const dayCode = lineData.dayCodes ? lineData.dayCodes[patternIndex] : (isOff ? 8 : 1);

                allDays.push({
                    dateStr,
                    date,
                    year,
                    month,
                    day,
                    dayOfWeek,
                    isWeekend,
                    shift,
                    isOff,
                    dayCode,
                    color: getColorForCode(dayCode),
                    monthName: MONTHS[month - 1]
                });
            });
        }

        function getColorForCode(dayCode) {
            if (COLOR_MAP[dayCode]) return COLOR_MAP[dayCode];
            if (window.DYNAMIC_COLOR_MAP && window.DYNAMIC_COLOR_MAP[dayCode]) {
                return window.DYNAMIC_COLOR_MAP[dayCode];
            }
            return '#ddd';
        }

        function renderRibbon() {
            const track = document.getElementById('ribbonTrack');
            track.innerHTML = '';

            const visibleRange = 40; // Days visible at once
            const startIdx = Math.max(0, currentDayIndex - 10);
            const endIdx = Math.min(allDays.length, currentDayIndex + visibleRange);

            for (let i = startIdx; i < endIdx; i++) {
                const dayData = allDays[i];
                const offset = i - currentDayIndex;

                const segment = document.createElement('div');
                segment.className = 'day-segment';
                if (i === currentDayIndex) segment.classList.add('current');
                if (i < currentDayIndex) segment.classList.add('passed');

                // 3D positioning - helix/spiral path
                const angle = (i * 8) * Math.PI / 180;
                const radius = 300;
                const x = Math.sin(angle) * radius;
                const y = offset * 25;
                const z = Math.cos(angle) * radius - 600 + offset * 30;

                segment.style.transform = `translate3d(${x + window.innerWidth/2 - 40}px, ${window.innerHeight/2 - 25 + y}px, ${z}px) rotateY(${-angle * 180/Math.PI}deg)`;
                segment.style.background = dayData.color;
                segment.style.color = needsLightText(dayData.dayCode) ? '#fff' : '#000';
                segment.textContent = dayData.isOff ? 'OFF' : dayData.shift;

                track.appendChild(segment);

                // Add month marker at start of each month
                if (dayData.day === 1 || i === startIdx) {
                    const marker = document.createElement('div');
                    marker.className = 'month-marker';
                    marker.textContent = dayData.monthName;
                    marker.style.transform = `translate3d(${x + window.innerWidth/2 + 60}px, ${window.innerHeight/2 + y}px, ${z}px)`;
                    track.appendChild(marker);
                }
            }
        }

        function needsLightText(dayCode) {
            return [4, 99].includes(dayCode) || (dayCode >= 10 && dayCode <= 15);
        }

        function updateDisplay() {
            if (currentDayIndex >= allDays.length) {
                isPlaying = false;
                document.getElementById('playPauseBtn').textContent = '▶';
                document.getElementById('playPauseBtn').classList.remove('active');
                return;
            }

            const dayData = allDays[currentDayIndex];

            // Update current date display
            document.getElementById('currentMonth').textContent = dayData.monthName;
            document.getElementById('currentDay').textContent = String(dayData.day).padStart(2, '0');
            document.getElementById('currentYear').textContent = dayData.year;

            const shiftEl = document.getElementById('currentShift');
            shiftEl.textContent = dayData.isOff ? 'DAY OFF' : dayData.shift;
            shiftEl.style.background = dayData.color;
            shiftEl.style.color = needsLightText(dayData.dayCode) ? '#fff' : '#000';

            // Update stats
            document.getElementById('dayCount').textContent = `${currentDayIndex + 1} / ${allDays.length}`;
            document.getElementById('workDays').textContent = workDays;
            document.getElementById('daysOff').textContent = daysOff;
            document.getElementById('weekendsOff').textContent = `${weekendDaysOff} / ${totalWeekendDays}`;

            // Update progress bar
            const progress = ((currentDayIndex + 1) / allDays.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // Render the 3D ribbon
            renderRibbon();
        }

        function animate(timestamp) {
            if (!isPlaying || allDays.length === 0) {
                animationFrame = requestAnimationFrame(animate);
                return;
            }

            if (!lastTimestamp) lastTimestamp = timestamp;
            const elapsed = timestamp - lastTimestamp;

            if (elapsed >= dayDuration / speed) {
                // Advance to next day
                if (currentDayIndex < allDays.length) {
                    const dayData = allDays[currentDayIndex];

                    // Update stats
                    if (dayData.isOff) {
                        daysOff++;
                        if (dayData.isWeekend) weekendDaysOff++;
                    } else {
                        workDays++;
                    }
                    if (dayData.isWeekend) totalWeekendDays++;

                    currentDayIndex++;
                    updateDisplay();
                }
                lastTimestamp = timestamp;
            }

            animationFrame = requestAnimationFrame(animate);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playPauseBtn');
            btn.textContent = isPlaying ? '❚❚' : '▶';
            btn.classList.toggle('active', isPlaying);

            if (isPlaying && currentDayIndex >= allDays.length) {
                rewind();
            }
        }

        function rewind() {
            currentDayIndex = 0;
            workDays = 0;
            daysOff = 0;
            weekendDaysOff = 0;
            totalWeekendDays = 0;
            lastTimestamp = 0;
            isPlaying = true;
            document.getElementById('playPauseBtn').textContent = '❚❚';
            document.getElementById('playPauseBtn').classList.add('active');
            updateDisplay();
        }

        function cycleSpeed() {
            const speeds = [0.5, 1, 2, 4, 8];
            const currentIdx = speeds.indexOf(speed);
            speed = speeds[(currentIdx + 1) % speeds.length];
            document.getElementById('speedDisplay').textContent = speed + 'x';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowRight':
                    if (!isPlaying && currentDayIndex < allDays.length - 1) {
                        currentDayIndex++;
                        const dayData = allDays[currentDayIndex - 1];
                        if (dayData.isOff) {
                            daysOff++;
                            if (dayData.isWeekend) weekendDaysOff++;
                        } else {
                            workDays++;
                        }
                        if (dayData.isWeekend) totalWeekendDays++;
                        updateDisplay();
                    }
                    break;
                case 'ArrowLeft':
                    if (!isPlaying && currentDayIndex > 0) {
                        currentDayIndex--;
                        // Recalculate stats (simple approach - go from start)
                        recalculateStats();
                        updateDisplay();
                    }
                    break;
                case 'r':
                    rewind();
                    break;
            }
        });

        function recalculateStats() {
            workDays = 0;
            daysOff = 0;
            weekendDaysOff = 0;
            totalWeekendDays = 0;
            for (let i = 0; i < currentDayIndex; i++) {
                const dayData = allDays[i];
                if (dayData.isOff) {
                    daysOff++;
                    if (dayData.isWeekend) weekendDaysOff++;
                } else {
                    workDays++;
                }
                if (dayData.isWeekend) totalWeekendDays++;
            }
        }

        // Start animation loop
        animationFrame = requestAnimationFrame(animate);

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
